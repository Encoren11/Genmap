<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Teyvat Interactive Map</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#10141b;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

#map{
    position:fixed;
    inset:0;
    z-index:1;
}

#map iframe{
    width:100%;
    height:100%;
    border:0;
}

.top{
    position:fixed;
    z-index:20;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    gap:8px;
}

.search{
    flex:1;
    height:48px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 14px;
    border-radius:15px;
    background:rgba(20,24,32,.96);
    border:1px solid rgba(255,255,255,.1);
}

.search input{
    width:100%;
    border:0;
    outline:0;
    color:#fff;
    background:transparent;
}

.search input::placeholder{
    color:#7e8795;
}

.top-btn{
    width:48px;
    height:48px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    background:rgba(20,24,32,.96);
    color:white;
}

.sidebar{
    position:fixed;
    z-index:30;
    top:68px;
    bottom:10px;
    left:10px;
    width:320px;
    padding:14px;
    overflow-y:auto;
    border-radius:20px;
    background:rgba(18,22,30,.98);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 15px 50px rgba(0,0,0,.5);
    transition:.25s;
}

.sidebar.hidden{
    transform:translateX(-350px);
}

.logo{
    font-size:20px;
    font-weight:700;
    margin-bottom:15px;
}

.logo small{
    display:block;
    color:#7f8897;
    font-size:10px;
    margin-top:4px;
    font-weight:400;
}

.section{
    margin-top:18px;
    margin-bottom:8px;
    color:#858e9d;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.item{
    width:100%;
    min-height:45px;
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:6px;
    padding:7px 9px;
    border:1px solid transparent;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    color:#fff;
    text-align:left;
}

.item:hover{
    background:rgba(255,255,255,.08);
}

.item.active{
    background:rgba(105,132,255,.18);
    border-color:rgba(105,132,255,.25);
}

.icon{
    width:32px;
    height:32px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:rgba(255,255,255,.07);
}

.item-text{
    flex:1;
}

.item-name{
    font-size:13px;
    font-weight:600;
}

.item-sub{
    margin-top:2px;
    font-size:9px;
    color:#7c8593;
}

.arrow{
    color:#737c8b;
}

.action{
    width:100%;
    min-height:44px;
    margin-bottom:7px;
    padding:0 12px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    background:rgba(255,255,255,.045);
    color:#fff;
    text-align:left;
}

.action.primary{
    background:rgba(105,132,255,.18);
    border-color:rgba(105,132,255,.3);
}

.bottom{
    display:none;
}

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.65);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(480px,100%);
    max-height:85vh;
    overflow:auto;
    padding:20px;
    border-radius:20px;
    background:#191e27;
    border:1px solid rgba(255,255,255,.1);
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.close{
    float:right;
    border:0;
    background:none;
    color:#aaa;
    font-size:25px;
}

.stat{
    padding:14px;
    margin-bottom:8px;
    border-radius:13px;
    background:rgba(255,255,255,.05);
}

.stat-title{
    font-weight:bold;
    margin-bottom:8px;
}

.bar{
    height:8px;
    overflow:hidden;
    border-radius:10px;
    background:#303641;
}

.bar div{
    height:100%;
    width:0%;
    background:#718cff;
    transition:.3s;
}

.percent{
    margin-top:6px;
    color:#9ba4b3;
    font-size:11px;
}

.note{
    width:100%;
    min-height:100px;
    resize:vertical;
    padding:12px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    outline:none;
    background:#10141b;
    color:#fff;
}

.route{
    padding:13px;
    margin-bottom:8px;
    border-radius:13px;
    background:rgba(255,255,255,.05);
}

.route b{
    display:block;
    margin-bottom:5px;
}

.route span{
    color:#8d96a5;
    font-size:11px;
}

@media(max-width:700px){

    .sidebar{
        left:10px;
        right:10px;
        bottom:78px;
        top:auto;
        width:auto;
        max-height:72vh;
        transform:translateY(calc(100% + 100px));
    }

    .sidebar.open{
        transform:translateY(0);
    }

    .sidebar.hidden{
        transform:translateY(calc(100% + 100px));
    }

    .bottom{
        position:fixed;
        z-index:40;
        left:10px;
        right:10px;
        bottom:10px;
        height:62px;
        display:flex;
        border-radius:18px;
        background:rgba(18,22,30,.98);
        border:1px solid rgba(255,255,255,.1);
    }

    .bottom button{
        flex:1;
        border:0;
        background:none;
        color:#7d8695;
        font-size:10px;
    }

    .bottom button div{
        font-size:18px;
        margin-bottom:3px;
    }

    .bottom button.active{
        color:#8da4ff;
    }
}
</style>
</head>

<body>

<div id="map">
<iframe
    id="mapFrame"
    src="https://genshin-impact-map.appsample.com/location?no_heading=1"
    allowfullscreen>
</iframe>
</div>

<div class="top">

    <div class="search">
        🔎
        <input id="searchInput"
               placeholder="Сундук, окулус, фея, руда...">
    </div>

    <button class="top-btn" id="menuBtn">☰</button>

</div>


<aside class="sidebar" id="sidebar">

<div class="logo">
    🗺️ Teyvat Map
    <small>Interactive Genshin Impact Map</small>
</div>


<div class="section">Основное</div>

<button class="item active" data-map="ALL">
    <div class="icon">🌎</div>
    <div class="item-text">
        <div class="item-name">Все метки</div>
        <div class="item-sub">Показать всё</div>
    </div>
</button>


<div class="section">Коллекционные предметы</div>

<div id="collectionList"></div>


<div class="section">Исследование</div>

<div id="explorationList"></div>


<div class="section">Материалы</div>

<div id="materialList"></div>


<div class="section">Боссы</div>

<div id="bossList"></div>


<div class="section">Головоломки</div>

<div id="puzzleList"></div>


<div class="section">Инструменты</div>

<button class="action primary" id="progressBtn">
📊 Прогресс
</button>

<button class="action" id="favoriteBtn">
⭐ Избранное
</button>

<button class="action" id="routeBtn">
🛣️ Маршруты
</button>

<button class="action" id="notesBtn">
📝 Мои заметки
</button>

<button class="action" id="settingsBtn">
⚙️ Настройки
</button>

</aside>


<div class="bottom">

<button id="mapTab" class="active">
    <div>🗺️</div>
    Карта
</button>

<button id="progressTab">
    <div>📊</div>
    Прогресс
</button>

<button id="favoriteTab">
    <div>⭐</div>
    Избранное
</button>

<button id="settingsTab">
    <div>⚙️</div>
    Настройки
</button>

</div>


<div class="modal" id="modal">

<div class="modal-box">

<button class="close" id="closeModal">×</button>

<div class="modal-title" id="modalTitle"></div>

<div id="modalContent"></div>

</div>

</div>


<script>

/* =========================================================
   ДАННЫЕ
========================================================= */

const categories = {

    collection: [

        ["Common Chest","📦","Обычные сундуки"],
        ["Exquisite Chest","💎","Богатые сундуки"],
        ["Precious Chest","💠","Драгоценные сундуки"],
        ["Luxurious Chest","👑","Роскошные сундуки"],
        ["Buried Chest","🏺","Закопанные сундуки"],
        ["Sealed Chest","🔒","Запечатанные сундуки"],

        ["Anemoculus","🌪️","Анемокулы"],
        ["Geoculus","🟡","Геокулы"],
        ["Electroculus","⚡","Электрокулы"],
        ["Dendroculus","🌿","Дендрокулы"],
        ["Hydroculus","💧","Гидрокулы"],
        ["Pyroculus","🔥","Пирокулы"],
        ["Lunoculus","🌙","Лунокулы"],

        ["Crimson Agate","🔴","Багровые агаты"],
        ["Spirit Carp","🐟","Карпы духа"]
    ],

    exploration: [

        ["Seelie","🧚","Феи"],
        ["Teleport Waypoint","🌀","Телепорты"],
        ["Statue of The Seven","🗿","Статуи"],
        ["World Quests","📜","Мировые квесты"],
        ["Time Trial Challenge","🎯","Испытания"],
        ["Viewpoint","👁️","Смотровые точки"],
        ["Domain","🏛️","Подземелья"]
    ],

    materials: [

        ["White Iron Chunk","⚪","Белое железо"],
        ["Crystal Chunk","💎","Кристалл"],
        ["Iron Chunk","⛏️","Железо"],
        ["Magical Crystal Chunk","🔷","Магический кристалл"],

        ["Dandelion Seed","🌼","Семя одуванчика"],
        ["Glaze Lily","🌸","Глазурная лилия"],
        ["Cor Lapis","🟡","Кор ляпис"],
        ["Wolfhook","🫐","Волчий крюк"],
        ["Starconch","🐚","Звёздная раковина"],
        ["Silk Flower","🌺","Шёлковый цветок"]
    ],

    bosses: [

        ["Anemo Hypostasis","🌪️","Анемо гипостазис"],
        ["Cryo Regisvine","❄️","Крио Регисвайн"],
        ["Cryo Hypostasis","❄️","Крио гипостазис"],
        ["Maguu Kenki","⚔️","Магу Кэнки"],
        ["Ruin Serpent","🐍","Змей руин"],
        ["Geovishap","🪨","Геовишап"]
    ],

    puzzles: [

        ["Pressure Plate","⬜","Нажимные плиты"],
        ["Torch Puzzle","🔥","Факелы"],
        ["Elemental Monument","🔷","Элементальные монументы"],
        ["Mini Puzzle","🧩","Мини-головоломки"],
        ["Light-Up Tile Puzzle","💡","Световые головоломки"]
    ]

};


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let state = JSON.parse(
    localStorage.getItem("teyvat_state") || "{}"
);

if(!state.progress)
    state.progress = {};

if(!state.favorites)
    state.favorites = [];

if(!state.notes)
    state.notes = "";

if(!state.routes)
    state.routes = [];


function save(){

    localStorage.setItem(
        "teyvat_state",
        JSON.stringify(state)
    );

}


/* =========================================================
   MAP
========================================================= */

const frame =
    document.getElementById("mapFrame");


function showMap(name){

    if(name === "ALL"){

        frame.src =
        "https://genshin-impact-map.appsample.com/location?no_heading=1";

        return;
    }

    frame.src =
    "https://genshin-impact-map.appsample.com/location?names="
    + encodeURIComponent(name)
    + "&no_heading=1";
}


/* =========================================================
   СОЗДАНИЕ СПИСКОВ
========================================================= */

function makeList(target,data){

    const el =
        document.getElementById(target);

    data.forEach(item=>{

        const [id,icon,name] = item;

        const button =
            document.createElement("button");

        button.className="item";

        button.dataset.map=id;

        button.innerHTML=`
            <div class="icon">${icon}</div>

            <div class="item-text">

                <div class="item-name">
                    ${name}
                </div>

                <div class="item-sub">
                    ${id}
                </div>

            </div>

            <div class="arrow">›</div>
        `;

        button.onclick=()=>{

            document
            .querySelectorAll(".item")
            .forEach(x=>
                x.classList.remove("active")
            );

            button.classList.add("active");

            showMap(id);

        };

        el.appendChild(button);

    });

}


makeList(
    "collectionList",
    categories.collection
);

makeList(
    "explorationList",
    categories.exploration
);

makeList(
    "materialList",
    categories.materials
);

makeList(
    "bossList",
    categories.bosses
);

makeList(
    "puzzleList",
    categories.puzzles
);


/* ВСЕ */

document
.querySelector('[data-map="ALL"]')
.onclick=()=>{

    document
    .querySelectorAll(".item")
    .forEach(x=>
        x.classList.remove("active")
    );

    document
    .querySelector('[data-map="ALL"]')
    .classList.add("active");

    showMap("ALL");

};


/* =========================================================
   ПОИСК
========================================================= */

const aliases = {

    "сундук": [
        "Common Chest",
        "Exquisite Chest",
        "Precious Chest",
        "Luxurious Chest",
        "Buried Chest",
        "Sealed Chest"
    ],

    "сундуки": [
        "Common Chest",
        "Exquisite Chest",
        "Precious Chest",
        "Luxurious Chest",
        "Buried Chest",
        "Sealed Chest"
    ],

    "окулус": [
        "Anemoculus",
        "Geoculus",
        "Electroculus",
        "Dendroculus",
        "Hydroculus",
        "Pyroculus",
        "Lunoculus"
    ],

    "окулусы": [
        "Anemoculus",
        "Geoculus",
        "Electroculus",
        "Dendroculus",
        "Hydroculus",
        "Pyroculus",
        "Lunoculus"
    ],

    "фея": ["Seelie"],
    "феи": ["Seelie"],

    "телепорт": ["Teleport Waypoint"],
    "телепорты": ["Teleport Waypoint"],

    "квест": ["World Quests"],
    "квесты": ["World Quests"],

    "испытание": ["Time Trial Challenge"],
    "испытания": ["Time Trial Challenge"],

    "головоломка": ["Mini Puzzle"],
    "головоломки": ["Mini Puzzle"],

    "факел": ["Torch Puzzle"],
    "факелы": ["Torch Puzzle"],

    "плита": ["Pressure Plate"],
    "плиты": ["Pressure Plate"]
};


document
.getElementById("searchInput")
.addEventListener("keydown",e=>{

    if(e.key !== "Enter")
        return;

    const text =
        e.target.value
        .trim()
        .toLowerCase();

    if(!text)
        return;

    let result =
        aliases[text];

    if(!result){

        const key =
            Object.keys(aliases)
            .find(x =>
                x.includes(text) ||
                text.includes(x)
            );

        if(key)
            result=aliases[key];

    }

    if(!result){

        alert("Ничего не найдено");

        return;
    }

    /*
       Если найдено несколько типов,
       AppSample принимает их через запятую.
    */

    frame.src =
        "https://genshin-impact-map.appsample.com/location?names="
        + encodeURIComponent(result.join(","))
        + "&no_heading=1";

});


/* =========================================================
   MODAL
========================================================= */

const modal =
    document.getElementById("modal");

const modalTitle =
    document.getElementById("modalTitle");

const modalContent =
    document.getElementById("modalContent");


function openModal(title,content){

    modalTitle.innerText=title;

    modalContent.innerHTML=content;

    modal.classList.add("show");

}


function closeModal(){

    modal.classList.remove("show");

}


document
.getElementById("closeModal")
.onclick=closeModal;


modal.onclick=e=>{

    if(e.target===modal)
        closeModal();

};


/* =========================================================
   ПРОГРЕСС
========================================================= */

const progressNames = {

    "Common Chest":"Обычные сундуки",
    "Exquisite Chest":"Богатые сундуки",
    "Precious Chest":"Драгоценные сундуки",
    "Luxurious Chest":"Роскошные сундуки",

    "Anemoculus":"Анемокулы",
    "Geoculus":"Геокулы",
    "Electroculus":"Электрокулы",
    "Dendroculus":"Дендрокулы",
    "Hydroculus":"Гидрокулы",
    "Pyroculus":"Пирокулы",
    "Lunoculus":"Лунокулы",

    "Seelie":"Феи",
    "World Quests":"Квесты"
};


function progressWindow(){

    let html="";

    Object.keys(progressNames)
    .forEach(id=>{

        const value =
            Number(state.progress[id] || 0);

        const total =
            Number(
                promptTotals[id] || 0
            );

        let percent=0;

        if(total)
            percent=
                Math.min(
                    100,
                    Math.round(value/total*100)
                );

        html+=`

        <div class="stat">

            <div class="stat-title">
                ${progressNames[id]}
            </div>

            <div>
                ${value} / ${total || "?"}
            </div>

            <div class="bar">
                <div style="width:${percent}%"></div>
            </div>

            <div class="percent">
                ${total ? percent+"%" : "Количество можно указать позже"}
            </div>

        </div>

        `;

    });


    html+=`

    <button class="action primary"
            onclick="changeProgress()">

        ✏️ Изменить прогресс

    </button>

    <button class="action"
            onclick="resetProgress()">

        🔄 Сбросить прогресс

    </button>

    `;


    openModal(
        "📊 Прогресс",
        html
    );

}


/*
   Количество точек специально вынесено отдельно.
   Его можно заменить актуальными числами,
   когда подключим собственные данные.
*/

const promptTotals={

    "Common Chest":0,
    "Exquisite Chest":0,
    "Precious Chest":0,
    "Luxurious Chest":0,

    "Anemoculus":54,
    "Geoculus":131,
    "Electroculus":181,
    "Dendroculus":271,
    "Hydroculus":225,
    "Pyroculus":249,
    "Lunoculus":197,

    "Seelie":0,
    "World Quests":0
};


function changeProgress(){

    const id =
        prompt(
            "Введите ID категории:\n\n"
            +Object.entries(progressNames)
            .map(x=>x[0]+" — "+x[1])
            .join("\n")
        );

    if(!id || !progressNames[id])
        return;

    const value =
        Number(
            prompt(
                "Сколько собрано?"
            )
        );

    if(
        !Number.isNaN(value) &&
        value>=0
    ){

        state.progress[id]=value;

        save();

        progressWindow();

    }

}


function resetProgress(){

    if(!confirm(
        "Сбросить весь прогресс?"
    ))
        return;

    state.progress={};

    save();

    progressWindow();

}


document
.getElementById("progressBtn")
.onclick=progressWindow;

document
.getElementById("progressTab")
.onclick=progressWindow;


/* =========================================================
   ИЗБРАННОЕ
========================================================= */

function favoriteWindow(){

    let html="";

    if(!state.favorites.length){

        html=`
        <div class="stat">
            Пока ничего нет.
        </div>
        `;

    }else{

        state.favorites.forEach((x,i)=>{

            html+=`

            <div class="stat">

                ⭐ ${x}

                <button
                    class="action"
                    onclick="removeFavorite(${i})">

                    Удалить

                </button>

            </div>

            `;

        });

    }

    html+=`

    <button
        class="action primary"
        onclick="addFavorite()">

        ➕ Добавить категорию

    </button>

    `;

    openModal(
        "⭐ Избранное",
        html
    );

}


function addFavorite(){

    const value =
        prompt(
            "Что добавить в избранное?"
        );

    if(!value)
        return;

    if(!state.favorites.includes(value))
        state.favorites.push(value);

    save();

    favoriteWindow();

}


function removeFavorite(i){

    state.favorites.splice(i,1);

    save();

    favoriteWindow();

}


document
.getElementById("favoriteBtn")
.onclick=favoriteWindow;

document
.getElementById("favoriteTab")
.onclick=favoriteWindow;


/* =========================================================
   МАРШРУТЫ
========================================================= */

function routeWindow(){

    let html="";

    if(!state.routes.length){

        html=`

        <div class="stat">

            Маршрутов пока нет.

        </div>

        `;

    }else{

        state.routes.forEach((r,i)=>{

            html+=`

            <div class="route">

                <b>🛣️ ${r.name}</b>

                <span>
                    ${r.description}
                </span>

                <button
                    class="action"
                    onclick="deleteRoute(${i})">

                    Удалить

                </button>

            </div>

            `;

        });

    }


    html+=`

    <button
        class="action primary"
        onclick="addRoute()">

        ➕ Новый маршрут

    </button>

    `;


    openModal(
        "🛣️ Маршруты",
        html
    );

}


function addRoute(){

    const name =
        prompt("Название маршрута:");

    if(!name)
        return;

    const description =
        prompt(
            "Что собирать по маршруту?"
        ) || "";

    state.routes.push({
        name,
        description
    });

    save();

    routeWindow();

}


function deleteRoute(i){

    state.routes.splice(i,1);

    save();

    routeWindow();

}


document
.getElementById("routeBtn")
.onclick=routeWindow;


/* =========================================================
   ЗАМЕТКИ
========================================================= */

function notesWindow(){

    openModal(
        "📝 Мои заметки",

        `

        <textarea
            class="note"
            id="notesArea"
            placeholder="Например: сначала активировать механизм возле телепорта...">${escapeHtml(state.notes)}</textarea>

        <br><br>

        <button
            class="action primary"
            onclick="saveNotes()">

            💾 Сохранить

        </button>

        `
    );

}


function saveNotes(){

    state.notes =
        document
        .getElementById("notesArea")
        .value;

    save();

    closeModal();

}


function escapeHtml(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


document
.getElementById("notesBtn")
.onclick=notesWindow;


/* =========================================================
   НАСТРОЙКИ
========================================================= */

function settingsWindow(){

    openModal(
        "⚙️ Настройки",

        `

        <div class="stat">

            <b>By Sin</b>

            <br><br>

            Буба лох 😂

        </div>


        <button
            class="action"
            onclick="toggleCompact()">

            📱 Переключить компактный режим

        </button>


        <button
            class="action"
            onclick="clearEverything()">

            🗑️ Очистить все данные

        </button>

        `
    );

}


function toggleCompact(){

    document
    .querySelector(".sidebar")
    .classList.toggle("hidden");

}


function clearEverything(){

    if(!confirm(
        "Удалить весь сохранённый прогресс, избранное и заметки?"
    ))
        return;

    localStorage.removeItem(
        "teyvat_state"
    );

    location.reload();

}


document
.getElementById("settingsBtn")
.onclick=settingsWindow;

document
.getElementById("settingsTab")
.onclick=settingsWindow;


/* =========================================================
   МОБИЛЬНОЕ МЕНЮ
========================================================= */

const sidebar =
    document.getElementById("sidebar");


document
.getElementById("menuBtn")
.onclick=()=>{

    if(innerWidth<=700){

        sidebar
        .classList
        .toggle("open");

    }else{

        sidebar
        .classList
        .toggle("hidden");

    }

};


document
.getElementById("mapTab")
.onclick=()=>{

    sidebar
    .classList
    .remove("open");

};
