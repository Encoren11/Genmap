<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no"
>

<title>Teyvat Map</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;
    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#10141b;
    color:#fff;
}


/* =========================
   MAP
========================= */

#map{

    position:fixed;
    inset:0;

    z-index:1;
}

#map iframe{

    width:100%;
    height:100%;

    border:0;
}


/* =========================
   TOP BAR
========================= */

.topbar{

    position:fixed;

    top:10px;
    left:10px;
    right:10px;

    z-index:50;

    display:flex;

    gap:8px;
}


.search{

    flex:1;

    height:48px;

    display:flex;
    align-items:center;

    gap:8px;

    padding:0 14px;

    border-radius:15px;

    background:
        rgba(18,22,30,.96);

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);
}


.search input{

    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    font-size:14px;
}


.search input::placeholder{

    color:#747d8c;
}


.menu-btn{

    width:48px;
    height:48px;

    border:1px solid
        rgba(255,255,255,.1);

    border-radius:15px;

    background:
        rgba(18,22,30,.96);

    color:white;

    font-size:20px;
}


/* =========================
   SIDE MENU
========================= */

.sidebar{

    position:fixed;

    z-index:40;

    top:68px;
    bottom:10px;
    left:10px;

    width:330px;

    overflow-y:auto;

    padding:14px;

    border-radius:20px;

    background:
        rgba(18,22,30,.98);

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);

    transition:.25s;
}


.sidebar.hidden{

    transform:
        translateX(-360px);
}


/* =========================
   LOGO
========================= */

.logo{

    padding:
        4px 5px
        14px;

    font-size:20px;

    font-weight:700;
}


.logo small{

    display:block;

    margin-top:4px;

    color:#788292;

    font-size:10px;

    font-weight:400;
}


/* =========================
   FILTER INFO
========================= */

.filter-info{

    padding:11px;

    margin-bottom:10px;

    border-radius:13px;

    background:
        rgba(105,132,255,.1);

    border:
        1px solid
        rgba(105,132,255,.16);

    font-size:11px;

    color:#aab5ca;
}


.filter-info b{

    color:white;
}


/* =========================
   SECTION
========================= */

.section{

    margin-top:17px;
    margin-bottom:8px;

    color:#7f8999;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================
   ITEM
========================= */

.item{

    width:100%;

    min-height:45px;

    display:flex;
    align-items:center;

    gap:9px;

    margin-bottom:6px;

    padding:7px 9px;

    border-radius:12px;

    border:
        1px solid
        transparent;

    background:
        rgba(255,255,255,.045);

    color:white;

    text-align:left;

    cursor:pointer;
}


.item:hover{

    background:
        rgba(255,255,255,.08);
}


.item.active{

    background:
        rgba(105,132,255,.2);

    border:
        1px solid
        rgba(105,132,255,.35);
}


.icon{

    width:32px;
    height:32px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:
        rgba(255,255,255,.07);

    font-size:17px;
}


.item-text{

    flex:1;
}


.item-name{

    font-size:13px;

    font-weight:600;
}


.item-sub{

    margin-top:2px;

    color:#737d8d;

    font-size:9px;
}


.check{

    width:20px;

    color:#7d91ff;

    text-align:center;

    font-size:14px;
}


/* =========================
   ACTIONS
========================= */

.action{

    width:100%;

    min-height:44px;

    margin-bottom:7px;

    padding:0 12px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.045);

    color:white;

    text-align:left;

    cursor:pointer;
}


.action:hover{

    background:
        rgba(255,255,255,.08);
}


.action.danger{

    color:#ff9c9c;

}


/* =========================
   MODAL
========================= */

.modal{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.7);
}


.modal.show{

    display:flex;
}


.modal-box{

    width:
        min(500px,100%);

    max-height:85vh;

    overflow:auto;

    padding:20px;

    border-radius:20px;

    background:#191e27;

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.6);
}


.modal-title{

    margin-bottom:15px;

    font-size:20px;

    font-weight:700;
}


.close{

    float:right;

    border:0;

    background:none;

    color:#aaa;

    font-size:26px;

    cursor:pointer;
}


/* =========================
   STATS
========================= */

.stat{

    margin-bottom:8px;

    padding:14px;

    border-radius:13px;

    background:
        rgba(255,255,255,.05);
}


.stat-title{

    margin-bottom:7px;

    font-weight:700;
}


.progress-bar{

    height:8px;

    margin-top:8px;

    overflow:hidden;

    border-radius:10px;

    background:#303641;
}


.progress-bar div{

    height:100%;

    background:#718cff;

    transition:.3s;
}


/* =========================
   NOTES
========================= */

textarea{

    width:100%;

    min-height:120px;

    padding:12px;

    resize:vertical;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.1);

    outline:0;

    background:#10141b;

    color:white;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom{

    position:fixed;

    z-index:60;

    left:10px;
    right:10px;
    bottom:10px;

    height:62px;

    display:flex;

    border-radius:18px;

    background:
        rgba(18,22,30,.98);

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.4);
}


.bottom button{

    flex:1;

    border:0;

    background:none;

    color:#7c8695;

    font-size:10px;

    cursor:pointer;
}


.bottom button div{

    margin-bottom:3px;

    font-size:18px;
}


.bottom button.active{

    color:#8da4ff;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .sidebar{

        top:auto;

        bottom:82px;

        left:10px;
        right:10px;

        width:auto;

        max-height:70vh;

        transform:
            translateY(
                calc(100% + 100px)
            );
    }


    .sidebar.open{

        transform:
            translateY(0);
    }


    .sidebar.hidden{

        transform:
            translateY(
                calc(100% + 100px)
            );
    }

}


/* =========================
   LIGHT THEME
========================= */

body.light{

    background:#eef1f5;

    color:#111;
}

body.light .sidebar,
body.light .search,
body.light .menu-btn,
body.light .bottom,
body.light .modal-box{

    background:#fff;

    color:#111;
}


body.light .item,
body.light .action{

    background:
        rgba(0,0,0,.04);

    color:#111;
}


body.light .search input{

    color:#111;
}


body.light .logo small,
body.light .item-sub{

    color:#7a818c;
}

</style>
</head>


<body>


<!-- =========================
     MAP
========================= -->

<div id="map">

<iframe
    id="mapFrame"

    src="
    https://genshin-impact-map.appsample.com/location
    ?no_heading=1
    "

    allowfullscreen>
</iframe>

</div>


<!-- =========================
     TOP
========================= -->

<div class="topbar">

<div class="search">

    🔎

    <input
        id="searchInput"
        placeholder="
        Сундук, окулус, фея, руда...
        "
    >

</div>


<button
    class="menu-btn"
    id="menuBtn">

    ☰

</button>

</div>


<!-- =========================
     SIDEBAR
========================= -->

<aside
    class="sidebar"
    id="sidebar">


<div class="logo">

    🗺️ Teyvat Map

    <small>
        Interactive Genshin Impact Map
    </small>

</div>


<div
    class="filter-info"
    id="filterInfo">

    Активных фильтров:
    <b id="filterCount">0</b>

</div>


<!-- QUICK -->

<div class="section">

    Быстрые действия

</div>


<button
    class="action"
    id="allButton">

    🌎 Все метки

</button>


<button
    class="action"
    id="clearButton">

    🧹 Очистить фильтры

</button>


<!-- COLLECTION -->

<div class="section">

    Сундуки и коллекционные

</div>

<div id="collectionList"></div>


<!-- OCULUS -->

<div class="section">

    Окулусы

</div>

<div id="oculusList"></div>


<!-- EXPLORATION -->

<div class="section">

    Исследование

</div>

<div id="explorationList"></div>


<!-- MATERIALS -->

<div class="section">

    Материалы

</div>

<div id="materialList"></div>


<!-- BOSSES -->

<div class="section">

    Боссы

</div>

<div id="bossList"></div>


<!-- PUZZLES -->

<div class="section">

    Головоломки

</div>

<div id="puzzleList"></div>


</aside>


<!-- =========================
     BOTTOM
========================= -->

<nav class="bottom">


<button
    id="mapTab"
    class="active">

    <div>🗺️</div>

    Карта

</button>


<button
    id="progressTab">

    <div>📊</div>

    Прогресс

</button>


<button
    id="favoriteTab">

    <div>⭐</div>

    Избранное

</button>


<button
    id="settingsTab">

    <div>⚙️</div>

    Настройки

</button>


</nav>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="modal">


<div class="modal-box">


<button
    class="close"
    id="closeModal">

    ×

</button>


<div
    class="modal-title"
    id="modalTitle">
</div>


<div
    id="modalContent">
</div>


</div>

</div>


<script>


/* =====================================================
   ДАННЫЕ
===================================================== */

const data = {

collection:[

["Common Chest","📦","Обычный сундук"],

["Exquisite Chest","💎","Богатый сундук"],

["Precious Chest","💠","Драгоценный сундук"],

["Luxurious Chest","👑","Роскошный сундук"],

["Buried Chest","🏺","Закопанный сундук"],

["Sealed Chest","🔒","Запечатанный сундук"]

],


oculus:[

["Anemoculus","🌪️","Анемокулы"],

["Geoculus","🟡","Геокулы"],

["Electroculus","⚡","Электрокулы"],

["Dendroculus","🌿","Дендрокулы"],

["Hydroculus","💧","Гидрокулы"],

["Pyroculus","🔥","Пирокулы"],

["Lunoculus","🌙","Лунокулы"]

],


exploration:[

["Seelie","🧚","Феи"],

["Teleport Waypoint","🌀","Телепорты"],

["Statue of The Seven","🗿","Статуи"],

["World Quests","📜","Мировые квесты"],

["Time Trial Challenge","🎯","Испытания"],

["Viewpoint","👁️","Смотровые точки"],

["Domain","🏛️","Подземелья"]

],


materials:[

["White Iron Chunk","⚪","Белое железо"],

["Crystal Chunk","💎","Кристалл"],

["Iron Chunk","⛏️","Железо"],

["Magical Crystal Chunk","🔷","Магический кристалл"],

["Dandelion Seed","🌼","Семя одуванчика"],

["Glaze Lily","🌸","Глазурная лилия"],

["Cor Lapis","🟡","Кор Ляпис"],

["Wolfhook","🫐","Волчий крюк"],

["Starconch","🐚","Звёздная раковина"],

["Silk Flower","🌺","Шёлковый цветок"]

],


bosses:[

["Anemo Hypostasis","🌪️","Анемо гипостазис"],

["Cryo Regisvine","❄️","Крио Регисвайн"],

["Cryo Hypostasis","❄️","Крио гипостазис"],

["Maguu Kenki","⚔️","Магу Кэнки"],

["Ruin Serpent","🐍","Змей руин"],

["Geovishap","🪨","Геовишап"]

],


puzzles:[

["Pressure Plate","⬜","Нажимные плиты"],

["Torch Puzzle","🔥","Факелы"],

["Elemental Monument","🔷","Элементальные монументы"],

["Mini Puzzle","🧩","Головоломки"],

["Light-Up Tile Puzzle","💡","Световые плитки"]

]

};


/* =====================================================
   STATE
===================================================== */

let selected =
JSON.parse(
    localStorage.getItem(
        "teyvat_filters"
    ) || "[]"
);


let favorites =
JSON.parse(
    localStorage.getItem(
        "teyvat_favorites"
    ) || "[]"
);


let notes =
localStorage.getItem(
    "teyvat_notes"
) || "";


/* =====================================================
   SAVE
===================================================== */

function save(){

    localStorage.setItem(
        "teyvat_filters",
        JSON.stringify(selected)
    );

    localStorage.setItem(
        "teyvat_favorites",
        JSON.stringify(favorites)
    );

    localStorage.setItem(
        "teyvat_notes",
        notes
    );

}


/* =====================================================
   MAP
===================================================== */

const frame =
document.getElementById(
    "mapFrame"
);


function updateMap(){

    if(
        selected.length === 0
    ){

        frame.src =
        "https://genshin-impact-map.appsample.com/location?names=__NONE__&no_heading=1";

    }else{

        frame.src =
        "https://genshin-impact-map.appsample.com/location?names="
        +
        encodeURIComponent(
            selected.join(",")
        )
        +
        "&no_heading=1";

    }


    document
    .getElementById(
        "filterCount"
    )
    .innerText =
        selected.length;

    save();

}


/* =====================================================
   BUTTON STATE
===================================================== */

function updateButtons(){

    document
    .querySelectorAll(
        ".item[data-id]"
    )
    .forEach(
        button => {

            const id =
                button.dataset.id;

            const active =
                selected.includes(id);

            button.classList.toggle(
                "active",
                active
            );

            button
            .querySelector(
                ".check"
            )
            .innerText =
                active
                ? "✓"
                : "";

        }
    );

}


/* =====================================================
   CREATE CATEGORY
===================================================== */

function createList(
    elementId,
    items
){

    const container =
        document.getElementById(
            elementId
        );


    items.forEach(
        item => {

            const [
                id,
                icon,
                name
            ] = item;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "item";


            button.dataset.id =
                id;


            button.innerHTML = `

                <div class="icon">
                    ${icon}
                </div>

                <div class="item-text">

                    <div class="item-name">
                        ${name}
                    </div>

                    <div class="item-sub">
                        ${id}
                    </div>

                </div>

                <div class="check"></div>

            `;


            button.onclick =
            () => {

                toggleCategory(id);

            };


            container.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   TOGGLE CATEGORY
===================================================== */

function toggleCategory(id){

    if(
        selected.includes(id)
    ){

        selected =
            selected.filter(
                x => x !== id
            );

    }else{

        selected.push(id);

    }


    updateButtons();

    updateMap();

}


/* =====================================================
   ALL
===================================================== */

document
.getElementById(
    "allButton"
)
.onclick = () => {

    selected = [];

    updateButtons();

    updateMap();

};


/* =====================================================
   CLEAR
===================================================== */

document
.getElementById(
    "clearButton"
)
.onclick = () => {

    selected = [];

    updateButtons();

    updateMap();

};


/* =====================================================
   SEARCH
===================================================== */

const aliases = {

"сундук":[

"Common Chest",
"Exquisite Chest",
"Precious Chest",
"Luxurious Chest",
"Buried Chest",
"Sealed Chest"

],

"сундуки":[

"Common Chest",
"Exquisite Chest",
"Precious Chest",
"Luxurious Chest",
"Buried Chest",
"Sealed Chest"

],

"окулус":[

"Anemoculus",
"Geoculus",
"Electroculus",
"Dendroculus",
"Hydroculus",
"Pyroculus",
"Lunoculus"

],

"окулусы":[

"Anemoculus",
"Geoculus",
"Electroculus",
"Dendroculus",
"Hydroculus",
"Pyroculus",
"Lunoculus"

],

"фея":[
"Seelie"
],

"феи":[
"Seelie"
],

"телепорт":[
"Teleport Waypoint"
],

"телепорты":[
"Teleport Waypoint"
],

"квест":[
"World Quests"
],

"квесты":[
"World Quests"
],

"испытание":[
"Time Trial Challenge"
],

"испытания":[
"Time Trial Challenge"
],

"головоломка":[
"Mini Puzzle"
],

"головоломки":[
"Mini Puzzle"
],

"факел":[
"Torch Puzzle"
],

"факелы":[
"Torch Puzzle"
],

"плита":[
"Pressure Plate"
],

"плиты":[
"Pressure Plate"
]

};


document
.getElementById(
    "searchInput"
)
.addEventListener(
    "keydown",
    event => {

        if(
            event.key !== "Enter"
        )
            return;


        const text =
            event.target.value
            .trim()
            .toLowerCase();


        if(!text)
            return;


        let result =
            aliases[text];


        if(!result){

            const key =
                Object.keys(
                    aliases
                )
                .find(
                    key =>
                        key.includes(text)
                        ||
                        text.includes(key)
                );


            if(key)
                result =
                    aliases[key];

        }


        if(!result){

            alert(
                "Ничего не найдено"
            );

            return;

        }


        selected =
            [...result];


        updateButtons();

        updateMap();

    }
);


/* =====================================================
   MODAL
===================================================== */

const modal =
document.getElementById(
    "modal"
);


const modalTitle =
document.getElementById(
    "modalTitle"
);


const modalContent =
document.getElementById(
    "modalContent"
);


function openModal(
    title,
    content
){

    modalTitle.innerText =
        title;

    modalContent.innerHTML =
        content;

    modal.classList.add(
        "show"
    );

}


function closeModal(){

    modal.classList.remove(
        "show"
    );

}


document
.getElementById(
    "closeModal"
)
.onclick =
    closeModal;


modal.onclick =
event => {

    if(
        event.target === modal
    )
        closeModal();

};


/* =====================================================
   PROGRESS
===================================================== */

document
.getElementById(
    "progressTab"
)
.onclick =
    () => {

        openModal(

            "📊 Прогресс",

            `

            <div class="stat">

                <div class="stat-title">
                    Активные категории
                </div>

                ${selected.length}

            </div>


            <div class="stat">

                <div class="stat-title">
                    Что будет дальше
                </div>

                После подключения
                собственных ID маркеров
                здесь появится настоящий
                прогресс:

                <br><br>

                💎 Сундуки
                <br>
                🌪️ Окулусы
                <br>
                🧚 Феи
                <br>
                🧩 Головоломки

            </div>

            `

        );

    };


/* =====================================================
   FAVORITES
===================================================== */

document
.getElementById(
    "favoriteTab"
)
.onclick =
    () => {

        openModal(

            "⭐ Избранное",

            `

            <div class="stat">

                Здесь будут
                сохранённые точки.

                <br><br>

                После подключения
                ID маркеров можно будет
                добавлять конкретные
                сундуки, окулусы,
                головоломки и т.д.

            </div>

            `

        );

    };


/* =====================================================
   SETTINGS
===================================================== */

document
.getElementById(
    "settingsTab"
)
.onclick =
    showSettings;


function showSettings(){

    openModal(

        "⚙️ Настройки",

        `

        <div class="stat">

            <b>By Sin</b>

            <br><br>

            Буба лох 😂

        </div>


        <button
            class="action"
            onclick="toggleTheme()">

            🌙 Сменить тему

        </button>


        <button
            class="action"
            onclick="resetFilters()">

            🔄 Сбросить фильтры

        </button>


        <button
            class="action danger"
            onclick="clearData()">

            🗑️ Очистить данные

        </button>

        `

    );

}


/* =====================================================
   THEME
===================================================== */

function toggleTheme(){

    document
    .body
    .classList
    .toggle(
        "light"
    );

}


/* =====================================================
   RESET FILTERS
===================================================== */

function resetFilters(){

    selected = [];

    updateButtons();

    updateMap();

    closeModal();

}


/* =====================================================
   CLEAR DATA
===================================================== */

function clearData(){

    if(
        !confirm(
            "Удалить все сохранённые данные?"
        )
    )
        return;


    localStorage.clear();

    location.reload();

}


/* =====================================================
   MOBILE MENU
===================================================== */

const sidebar =
document.getElementById(
    "sidebar"
);


document
.getElementById(
    "menuBtn"
)
.onclick = () => {

    if(
        innerWidth <= 700
    ){

        sidebar
        .classList
        .toggle(
            "open"
        );

    }else{

        sidebar
        .classList
        .toggle(
            "hidden"
        );

    }

};


/* =====================================================
   MAP TAB
===================================================== */

document
.getElementById(
    "mapTab"
)
.onclick = () => {

    sidebar
    .classList
    .remove(
        "open"
    );

};


/* =====================================================
   BUILD
===================================================== */

createList(
    "collectionList",
    data.collection
);


createList(
    "oculusList",
    data.oculus
);


createList(
    "explorationList",
    data.exploration
);


createList(
    "materialList",
    data.materials
);


createList(
    "bossList",
    data.bosses
);


createList(
    "puzzleList",
    data.puzzles
);


/* =====================================================
   START
===================================================== */

updateButtons();

updateMap();

</script>
